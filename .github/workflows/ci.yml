name: CI

on:
  # Prose does not compile. A change that only touches documentation cannot
  # break a build, so it does not get one. The list is repeated because GitHub
  # Actions does not read YAML anchors.
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  # A merge lands as a push to main, so this covers merged pull requests too.
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform breaking should not hide the others
      matrix:
        include:
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }

    steps:
      - uses: actions/checkout@v7

      # raylib compiles against the X11, Wayland and audio headers, which are
      # not on a bare runner. Everything else comes with the image.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev

      # SELF_CONTAINED builds raylib from source, which is what a release does
      # and therefore what CI should prove still works.
      - name: Configure
        run: cmake -B build -DSELF_CONTAINED=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

  # The APK needs a toolchain none of the matrix rows have, and no signing key:
  # a debug build proves the same thing about the code.
  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      - name: Build
        run: ./android/gradlew -p android assembleDebug
