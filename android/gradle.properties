org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true

# This project is written against the classic Groovy DSL, which AGP 9 still
# ships but no longer selects on its own.
android.newDsl=false

# The only Java in this app is one activity, and there is no Kotlin at all. Left
# on, AGP's built-in Kotlin support puts kotlin-stdlib on the classpath and 2.5 MB
# of dex in the APK for a language this project does not use.
android.builtInKotlin=false
